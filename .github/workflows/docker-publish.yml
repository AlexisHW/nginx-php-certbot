name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/README.md'
      - '**/readme.md'
      - '**/VERSION'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Шаг 1. Определяем, в каких папках были изменения (игнорируя README.md и VERSION)
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed folders
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            php74:
              - 'php74/**'
              - '!php74/**/[Rr][Ee][Aa][Dd][Mm][Ee].md'
              - '!php74/VERSION'
            php74-cms:
              - 'php74-cms/**'
              - '!php74-cms/**/[Rr][Ee][Aa][Dd][Mm][Ee].md'
              - '!php74-cms/VERSION'
            php83:
              - 'php83/**'
              - '!php83/**/[Rr][Ee][Aa][Dd][Mm][Ee].md'
              - '!php83/VERSION'
            php83-cms:
              - 'php83-cms/**'
              - '!php83-cms/**/[Rr][Ee][Aa][Dd][Mm][Ee].md'
              - '!php83-cms/VERSION'

  # Шаг 2. Собираем образ с именем папки и текущей версией из файла VERSION
  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # Последовательная сборка предотвращает конфликты при авто-коммите файла VERSION
      matrix:
        folder: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["php74","php74-cms","php83","php83-cms"]') || fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Read version and calculate next
        id: ver
        run: |
          CURRENT_VER=$(tr -d ' \n\r' < "${{ matrix.folder }}/VERSION")
          if [ -z "$CURRENT_VER" ]; then CURRENT_VER="1.0"; fi
          
          # Разбиваем версию X.Y и увеличиваем Y на 1 (1.0 -> 1.1, 1.9 -> 1.10)
          MAJOR=$(echo "$CURRENT_VER" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VER" | cut -d. -f2)
          NEXT_MINOR=$((MINOR + 1))
          NEXT_VER="${MAJOR}.${NEXT_MINOR}"
          
          echo "current=${CURRENT_VER}" >> $GITHUB_OUTPUT
          echo "next=${NEXT_VER}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.folder }}:${{ steps.ver.outputs.current }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.folder }}
          file: ./${{ matrix.folder }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.folder }}:${{ steps.ver.outputs.current }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.folder }}:latest
          cache-from: type=gha,scope=${{ matrix.folder }}
          cache-to: type=gha,mode=max,scope=${{ matrix.folder }}

      - name: Bump VERSION file in repository
        run: |
          git pull --rebase origin ${{ github.ref_name }}
          echo "${{ steps.ver.outputs.next }}" > "${{ matrix.folder }}/VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add "${{ matrix.folder }}/VERSION"
          git commit -m "chore(${{ matrix.folder }}): bump version to ${{ steps.ver.outputs.next }} [skip ci]"
          git push
