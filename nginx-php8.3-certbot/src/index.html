<!DOCTYPE html>
        <html lang="ru">
        <head>
            <meta charset="UTF-8">
            <title>Информация о подключении</title>
            <style>
                body { font-family: sans-serif; margin: 40px; background: #f4f6f9; color: #333; }
                .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
                h1 { color: #007bff; font-size: 24px; margin-top: 0; }
                ul { list-style: none; padding: 0; }
                li { margin: 10px 0; padding-bottom: 10px; border-bottom: 1px solid #eee; }
                strong { color: #555; }
            </style>
        </head>
        <body>
            <div class="card">
                <h1>Привет! Как дела?</h1>
                <p>Вот полезная информация о вашем подключении:</p>
                <ul>
                    <li><strong>Ваш IP-адрес:</strong> $remote_addr</li>
                    <li><strong>Браузер (User-Agent):</strong> $http_user_agent</li>
                    <li><strong>Запрошенный URL:</strong> $request_uri</li>
                    <li><strong>Метод запроса:</strong> $request_method</li>
                </ul>
            </div>
        </body>
        </html>
